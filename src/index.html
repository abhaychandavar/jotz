<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost">
<title>jotz</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="bar" data-tauri-drag-region>
      <button id="side-toggle" class="icon" title="Show / hide jots (⌘\)" hidden>
        <svg viewBox="0 0 24 24"></svg>
      </button>
      <button id="back" class="icon" title="Back (Esc)" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="bar-title" data-tauri-drag-region>Jots</div>
      <div class="spacer" data-tauri-drag-region></div>
      <div id="bar-actions"></div>
    </header>
    <div id="body">
      <aside id="side"></aside>
      <main id="screen"></main>
    </div>
    <div id="toast" hidden></div>
    <div id="modal" hidden></div>
  </div>
  <script src="tauri-shim.js"></script>
  <script src="icons.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
